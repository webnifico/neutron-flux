[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron-flux"
dynamic = ["version"]
description = "OpenStack-visible network and routing validation from disposable virtual machines"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=5",
    "tomli>=2; python_version < '3.11'",
]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "mypy>=1.10",
    "pip>=23",
    "pyflakes>=3.2",
    "ruff==0.16.0",
    "setuptools>=68",
]

[project.scripts]
neutron-flux = "neutron_flux.cli:main"

[project.urls]
Repository = "https://github.com/webnifico/neutron-flux"
Issues = "https://github.com/webnifico/neutron-flux/issues"

[tool.setuptools.packages.find]
include = ["neutron_flux*"]

[tool.setuptools.dynamic]
version = {attr = "neutron_flux.constants.VERSION"}

[tool.pytest.ini_options]
testpaths = ["support/tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["neutron_flux"]

[tool.coverage.report]
fail_under = 67
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Incremental clean-module gate; this is not yet a full-package type check.
# Each listed module is checked in full without importing unchecked modules.
follow_imports = "skip"
files = [
    "neutron_flux/constants.py",
    "neutron_flux/scheduling.py",
    "neutron_flux/aggregate_policy.py",
    "neutron_flux/configuration/snapshots.py",
    "neutron_flux/errors.py",
    "neutron_flux/models.py",
    "neutron_flux/policy.py",
    "neutron_flux/progress.py",
    "neutron_flux/check_plan.py",
    "neutron_flux/check_ledger.py",
    "neutron_flux/check_resume.py",
    "neutron_flux/gateway_policy.py",
    "neutron_flux/az_policy.py",
    "neutron_flux/cancellation.py",
    "neutron_flux/contract_assessment.py",
    "neutron_flux/coverage_ledger.py",
    "neutron_flux/pair_suite.py",
    "neutron_flux/pair_workflow.py",
    "neutron_flux/pair_placement.py",
    "neutron_flux/pair_executor.py",
    "neutron_flux/reporting_components/evidence_pool.py",
    "neutron_flux/test_names.py",
    "neutron_flux/failure_injection.py",
    "neutron_flux/mtu_contract.py",
    "neutron_flux/mtu_probes.py",
    "neutron_flux/network_contract.py",
    "neutron_flux/performance_metrics.py",
    "neutron_flux/resource_naming.py",
    "neutron_flux/replay_plan.py",
    "neutron_flux/report_exports.py",
    "neutron_flux/reporting_components/html_template.py",
    "neutron_flux/reporting_components/report_payload.py",
    "neutron_flux/results_io.py",
    "neutron_flux/terminology.py",
    "neutron_flux/translation_safety.py",
    "neutron_flux/utils.py",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"support/tests/_shared.py" = ["F401"]
"support/tests/test_*.py" = ["F403", "F405"]
