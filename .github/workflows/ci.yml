name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install development dependencies
        run: |
          uv sync --locked --extra test --extra dev
          npm install --prefix "$RUNNER_TEMP/neutron-flux-dom" --no-save --no-package-lock --no-audit --no-fund jsdom@30.1.3

      - name: Run offline release checks
        env:
          NODE_PATH: ${{ runner.temp }}/neutron-flux-dom/node_modules
        run: |
          set -o pipefail
          uv run --no-sync python support/scripts/validate-release.py 2>&1 | tee "$RUNNER_TEMP/offline-validation.log"

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation
          path: |
            ${{ runner.temp }}/offline-validation.log
            ${{ runner.temp }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
